name: Daily M3U Scraper

on:
  schedule:
    - cron: '0 0 * * *' # Berjalan setiap hari jam 00:00 UTC
  workflow_dispatch: # Mengizinkan Anda menjalankan skrip secara manual melalui tombol di GitHub

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wajib agar bot bisa menyimpan file ke repositori

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Scraper Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_m3u.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_m3u.txt
          git commit -m "Auto-update daily M3U links" || echo "No changes to commit"
          git push
